[package]
name = "esm-db"
description = "SQLite schema management, migrations, repository layer, and save system"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
esm-core = { path = "../esm-core" }
esm-data = { path = "../esm-data" }
esm-models = { path = "../esm-models" }
refinery = { version = "0.8", features = ["rusqlite"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
